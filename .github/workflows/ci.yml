name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }}${{ matrix.mosdepth && ', mosdepth' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux with mosdepth (the default backend)
          - os: ubuntu-latest
            python-version: "3.10"
            mosdepth: true
          - os: ubuntu-latest
            python-version: "3.12"
            mosdepth: true
          # Linux without mosdepth (exercises the pysam fallback)
          - os: ubuntu-latest
            python-version: "3.12"
            mosdepth: false
          # macOS (no static mosdepth binary; fallback path)
          - os: macos-latest
            python-version: "3.12"
            mosdepth: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install mosdepth
        if: ${{ matrix.mosdepth }}
        run: |
          curl -sL -o mosdepth https://github.com/brentp/mosdepth/releases/latest/download/mosdepth
          chmod +x mosdepth
          sudo mv mosdepth /usr/local/bin/

      - name: Install cuban
        run: pip install -e '.[test]'

      - name: Run tests
        run: pytest tests/ -v

      - name: End-to-end render
        run: |
          cuban --sv-type DEL --chrom chr1 --start 20000 --end 25000 \
                --sample TEST:ill:tests/data/test.bam \
                --repeats tests/data/repeats.tsv \
                --cache-dir ./cache --out ./smoke.png
          test -s smoke.png
